# A throwaway collector: OTLP/HTTP in, the remote tap, records written to a file.
receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
processors:
  remotetap: { endpoint: 0.0.0.0:12001, limit: 50 }
exporters:
  file: { path: /tmp/out/records.jsonl }
service:
  telemetry: { metrics: { level: none } }
  pipelines:
    logs: { receivers: [otlp], processors: [remotetap], exporters: [file] }
